<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Remembered choices</title>
    <link rel="stylesheet" href="prompt.css" />
  </head>
  <body class="options">
    <header class="titlebar">
      <button class="icon" id="back" title="Back to settings">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 5l-7 7 7 7" />
        </svg>
      </button>
      <span class="title">Remembered choices</span>
    </header>

    <p class="lead hint" id="empty" hidden>
      Nothing is remembered yet. Tick a box on a download prompt and the same
      question will not be put again.
    </p>

    <div class="field" id="siteBlock" hidden>
      <span class="label">Sites</span>
      <div class="rules" id="sites"></div>
    </div>

    <div class="field" id="typeBlock" hidden>
      <span class="label">File types</span>
      <div class="rules" id="types"></div>
    </div>

    <p class="lead hint" id="precedence" hidden>
      A site is answered by its own rule even when the file type has one too.
    </p>

    <p class="status" id="status"></p>

    <script src="rules.js"></script>
  </body>
</html>
